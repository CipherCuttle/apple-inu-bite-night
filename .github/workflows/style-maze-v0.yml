name: style-maze-v0

on:
  push:
    branches:
      - tmp/style-maze-v0

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/style-maze-v0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply style + maze pass
        run: node scripts/apply-style-maze-v0.mjs
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Remove one-shot tooling
        if: success()
        run: |
          rm -f scripts/apply-style-maze-v0.mjs .github/workflows/style-maze-v0.yml
      - name: Commit verified candidate
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add style meter and maze run v0'
          git push origin HEAD:tmp/style-maze-v0
