name: kernel-v0-wire

on:
  push:
    branches: [phase-2/hero-weapon-ability-kernel-v0]

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/hero-weapon-ability-kernel-v0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Wire kernel into deterministic GameState
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/sim/GameState.ts')
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} match(es), got {count}: {old[:90]!r}')
              text = text.replace(old, new)

          replace_exact(
              "import { isPointInSwordArc, normalizeAngle, swordForAttack, type AttackKind } from '../combat/Sword'\n",
              "import { isPointInSwordArc, normalizeAngle, type AttackKind } from '../combat/Sword'\n"
              "import { heroDefinition, type HeroDefinition } from '../build/Hero'\n"
              "import { DEFAULT_LOADOUT, loadoutFingerprint, validateLoadout, type Loadout } from '../build/Loadout'\n"
              "import { weaponAttackForInput, type WeaponId } from '../build/Weapon'\n",
          )
          replace_exact("const PLAYER_SPEED = 3.25\nconst PLAYER_RADIUS = 14\n", "")
          replace_exact("const PLAYER_MAX_HP = 5\n", "")
          replace_exact(
              "  readonly rng: XorShift32\n",
              "  readonly rng: XorShift32\n  readonly loadout: Loadout\n  readonly hero: HeroDefinition\n",
          )
          replace_exact(
              "  readonly player: PlayerState = { x: MAZE_START.x, y: MAZE_START.y, facing: 0, hp: PLAYER_MAX_HP, invulnerableTicks: 0 }\n",
              "  readonly player: PlayerState\n",
          )
          replace_exact(
              "  constructor(seed: number) {\n    this.seed = seed >>> 0\n    this.rng = new XorShift32(seed)\n    this.ensurePopulation()\n  }",
              "  constructor(seed: number, loadout: Loadout = DEFAULT_LOADOUT) {\n"
              "    this.seed = seed >>> 0\n"
              "    this.rng = new XorShift32(seed)\n"
              "    this.loadout = validateLoadout(loadout)\n"
              "    this.hero = heroDefinition(this.loadout.heroId)\n"
              "    this.player = { x: MAZE_START.x, y: MAZE_START.y, facing: 0, hp: this.hero.baseStats.maxHp, invulnerableTicks: 0 }\n"
              "    this.ensurePopulation()\n"
              "  }",
          )
          replace_exact('PLAYER_MAX_HP', 'this.hero.baseStats.maxHp', expected=1)
          replace_exact("      this.trySwordAttack(input)\n", "      this.tryWeaponAttack(input)\n")
          replace_exact("  private trySwordAttack(input: InputState): void {\n", "  private tryWeaponAttack(input: InputState): void {\n")
          replace_exact("    const config = swordForAttack(attack)\n", "    const config = weaponAttackForInput(this.loadout.weaponId, attack)\n")
          replace_exact(
              "    const config = swordForAttack('dash')\n",
              "    const config = weaponAttackForInput(this.loadout.weaponId, 'dash')\n",
              expected=2,
          )
          replace_exact('PLAYER_SPEED', 'this.hero.movementProfile.speed', expected=1)
          replace_exact('PLAYER_RADIUS', 'this.hero.movementProfile.collisionRadius', expected=6)
          replace_exact(
              "      type: 'sword-attack'\n      attack: AttackKind\n",
              "      type: 'weapon-attack'\n      weaponId: WeaponId\n      attack: AttackKind\n",
          )
          replace_exact(
              "    this.events.push({ type: 'sword-attack', attack, tick: this.tick, x: this.player.x, y: this.player.y, facing: this.player.facing })",
              "    this.events.push({ type: 'weapon-attack', weaponId: this.loadout.weaponId, attack, tick: this.tick, x: this.player.x, y: this.player.y, facing: this.player.facing })",
          )
          replace_exact(
              "      type: 'sword-attack',\n      attack: 'dash',",
              "      type: 'weapon-attack',\n      weaponId: this.loadout.weaponId,\n      attack: 'dash',",
          )
          replace_exact(
              "    feed(this.rng.snapshot())\n",
              "    feed(this.rng.snapshot())\n"
              "    const fingerprint = loadoutFingerprint(this.loadout)\n"
              "    for (let i = 0; i < fingerprint.length; i += 1) feed(fingerprint.charCodeAt(i))\n",
          )

          for legacy in ('swordForAttack', 'trySwordAttack', 'PLAYER_MAX_HP', 'PLAYER_RADIUS', 'PLAYER_SPEED', "type: 'sword-attack'"):
              if legacy in text:
                  raise SystemExit(f'legacy hard-coded combat/player symbol remains: {legacy}')

          path.write_text(text)

          for other in [
              Path('src/game/scenes/GameScene.ts'),
              Path('tests/special-attacks.test.ts'),
              Path('tests/manual-combat.test.ts'),
          ]:
              other_text = other.read_text()
              if 'sword-attack' not in other_text:
                  raise SystemExit(f'expected legacy event name in {other}')
              other.write_text(other_text.replace('sword-attack', 'weapon-attack'))
          PY
      - name: Add runtime integration coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/build-kernel.test.ts')
          text = path.read_text()
          old_import = "import { SWORD_ATTACKS } from '../src/game/combat/Sword'\n"
          if text.count(old_import) != 1:
              raise SystemExit('GameState import marker mismatch')
          text = text.replace(old_import, old_import + "import { GameState } from '../src/game/sim/GameState'\n", 1)

          marker = "  it('validates loadouts and gives authoritative selections a stable fingerprint', () => {\n"
          if text.count(marker) != 1:
              raise SystemExit('integration insertion marker mismatch')
          addition = """  it('routes authoritative attacks through the equipped weapon without a shop dependency', () => {\n    const mouth = new GameState(77, DEFAULT_LOADOUT)\n    const spear = new GameState(77, { ...DEFAULT_LOADOUT, weaponId: 'spear' })\n    mouth.player.hp = 999\n    spear.player.hp = 999\n\n    const mouthTarget = mouth.enemies.items.find((enemy) => enemy.active)\n    const spearTarget = spear.enemies.items.find((enemy) => enemy.active)\n    expect(mouthTarget).toBeDefined()\n    expect(spearTarget).toBeDefined()\n    if (!mouthTarget || !spearTarget) return\n\n    for (const [state, target] of [[mouth, mouthTarget], [spear, spearTarget]] as const) {\n      target.x = state.player.x + 160\n      target.y = state.player.y\n      target.speed = 0\n      target.hp = 5\n    }\n\n    mouth.step({ x: 0, y: 0, aimRadians: 0, stab: true })\n    spear.step({ x: 0, y: 0, aimRadians: 0, stab: true })\n\n    expect(mouth.events.some((event) => event.type === 'enemy-hit' && event.enemyId === mouthTarget.id)).toBe(false)\n    expect(spear.events.some((event) => event.type === 'enemy-hit' && event.enemyId === spearTarget.id)).toBe(true)\n    expect(spear.events.some((event) => event.type === 'weapon-attack' && event.weaponId === 'spear')).toBe(true)\n  })\n\n  it('makes loadout identity part of deterministic state hashing', () => {\n    const spearA = new GameState(99, { ...DEFAULT_LOADOUT, weaponId: 'spear' })\n    const spearB = new GameState(99, { ...DEFAULT_LOADOUT, weaponId: 'spear' })\n    const greatsword = new GameState(99, { ...DEFAULT_LOADOUT, weaponId: 'greatsword' })\n\n    for (let tick = 0; tick < 90; tick += 1) {\n      const input = { x: 0, y: 0, aimRadians: 0, stab: tick % 17 === 0 }\n      spearA.step(input)\n      spearB.step(input)\n      greatsword.step(input)\n    }\n\n    expect(spearA.resultHash()).toBe(spearB.resultHash())\n    expect(spearA.resultHash()).not.toBe(greatsword.resultHash())\n  })\n\n"""
          path.write_text(text.replace(marker, addition + marker, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:determinism
      - name: Commit wired kernel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/sim/GameState.ts src/game/scenes/GameScene.ts tests/special-attacks.test.ts tests/manual-combat.test.ts tests/build-kernel.test.ts
          git diff --cached --check
          git commit -m "feat: wire loadout kernel into deterministic combat"
          git push
