name: publish-githack-preview

on:
  push:
    branches: [githack-phase3-stamina-dodge-v0]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: githack-phase3-stamina-dodge-v0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build relative static preview
        run: pnpm exec vite build --base=./
      - name: Replace preview branch contents with dist
        run: |
          cp -a dist /tmp/githack-site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/githack-site/. .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'preview: publish phase3 GitHack build'
          git push origin HEAD:githack-phase3-stamina-dodge-v0
