name: player-identity-v1

on:
  push:
    branches:
      - tmp/player-identity-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/player-identity-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Patch Apple Inu player identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/game/scenes/GameScene.ts')
          s = path.read_text()

          s = s.replace("const SWORD_MOUTH_X = 26\n", "const SWORD_MOUTH_X = 28\nconst SWORD_REST_ANGLE = -Math.PI * 0.42\n")
          s = s.replace("    this.load.image('apple-inu-body', 'assets/characters/apple-inu/body.png')\n", "")
          s = s.replace("    this.load.image('apple-inu-head', 'assets/characters/apple-inu/head.png')\n", "")

          new_create = r'''  private createPlayer(): void {
    const bladeLength = BASE_SWORD.outerRadius - BASE_SWORD.innerRadius
    const dark = 0x17151b
    const fur = 0xf5f4ee
    const furHighlight = 0xffffff
    const furShade = 0xd7dae2
    const green = 0x5bbd4a

    const makeTrail = (angle: number) =>
      this.add
        .rectangle(SWORD_MOUTH_X, 0, bladeLength, 11, 0xff4f8d, 1)
        .setOrigin(0, 0.5)
        .setRotation(SWORD_REST_ANGLE + angle)
        .setAlpha(0)

    this.swordTrails = SLASH_TRAIL_ANGLES.map(makeTrail)

    // White dog body: broad readable torso, four paws and tail.
    const shadow = this.add.ellipse(-7, 7, 58, 34, 0x000000, 0.28)
    const tail = this.add.ellipse(-31, -2, 23, 9, furShade).setStrokeStyle(3, dark).setRotation(-0.72)
    const hind = this.add.ellipse(-22, 0, 23, 23, fur).setStrokeStyle(3, dark)
    const body = this.add.ellipse(-5, 0, 48, 31, fur).setStrokeStyle(3, dark)
    const chest = this.add.ellipse(8, 0, 29, 25, furHighlight).setStrokeStyle(2, dark)
    const pawBackTop = this.add.ellipse(-18, -14, 15, 8, furShade).setStrokeStyle(2, dark).setRotation(-0.18)
    const pawBackBottom = this.add.ellipse(-18, 14, 15, 8, furShade).setStrokeStyle(2, dark).setRotation(0.18)
    const pawFrontTop = this.add.ellipse(5, -15, 16, 8, furHighlight).setStrokeStyle(2, dark).setRotation(-0.12)
    const pawFrontBottom = this.add.ellipse(5, 15, 16, 8, furHighlight).setStrokeStyle(2, dark).setRotation(0.12)

    // Bitten-apple-shaped head silhouette. Dark cut-outs create the recognizable bite.
    const headOutline = this.add.ellipse(15, 0, 43, 41, dark)
    const appleMid = this.add.ellipse(14, 1, 35, 35, fur)
    const appleLobeTop = this.add.circle(8, -10, 13, furHighlight)
    const appleLobeBottom = this.add.circle(8, 10, 13, fur)
    const appleFront = this.add.ellipse(20, 1, 26, 31, fur)
    const biteUpper = this.add.circle(32, -5, 6, dark)
    const biteLower = this.add.circle(33, 5, 5, dark)
    const stem = this.add.rectangle(13, -22, 4, 9, 0x79513a).setRotation(0.22)
    const leaf = this.add.ellipse(5, -26, 17, 8, green).setStrokeStyle(2, dark).setRotation(-0.42)

    // The sword is bitten sideways: hilt is physically sandwiched between jaw layers.
    const lowerJaw = this.add.ellipse(SWORD_MOUTH_X - 2, 4, 18, 8, furShade).setStrokeStyle(2, dark)
    this.sword = this.add
      .image(SWORD_MOUTH_X, 0, 'apple-inu-sword')
      .setOrigin(0.08, 0.5)
      .setRotation(SWORD_REST_ANGLE)
      .setScale(1.04)
    const upperJaw = this.add.ellipse(SWORD_MOUTH_X - 2, -4, 18, 8, furHighlight).setStrokeStyle(2, dark)
    const toothTop = this.add.triangle(SWORD_MOUTH_X + 1, -1, 0, 0, 5, 0, 2, 5, 0xfefefe).setRotation(0.08)
    const toothBottom = this.add.triangle(SWORD_MOUTH_X + 1, 1, 0, 0, 5, 0, 2, -5, 0xe9e9e5).setRotation(-0.08)

    this.headRig = this.add.container(0, 0, [
      ...this.swordTrails,
      headOutline,
      appleMid,
      appleLobeTop,
      appleLobeBottom,
      appleFront,
      biteUpper,
      biteLower,
      stem,
      leaf,
      lowerJaw,
      this.sword,
      upperJaw,
      toothTop,
      toothBottom,
    ])
    this.player = this.add
      .container(WORLD_CX, WORLD_CY, [
        shadow,
        tail,
        pawBackTop,
        pawBackBottom,
        hind,
        body,
        chest,
        pawFrontTop,
        pawFrontBottom,
        this.headRig,
      ])
      .setDepth(10)
  }

  private animateSword'''

          s, n = re.subn(r"  private createPlayer\(\): void \{.*?\n  \}\n\n  private animateSword", new_create, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'createPlayer replacement count={n}')

          new_anim = r'''  private animateSword(event: Extract<SimEvent, { type: 'sword-attack' }>): void {
    const attack: AttackKind = event.attack
    this.tweens.killTweensOf(this.headRig)
    this.tweens.killTweensOf(this.sword)
    for (const trail of this.swordTrails) this.tweens.killTweensOf(trail)

    this.headRig.setPosition(0, 0).setRotation(0)
    this.sword
      .setPosition(SWORD_MOUTH_X, 0)
      .setRotation(SWORD_REST_ANGLE)
      .setScale(1.04, 1.04)
      .setAlpha(1)
    for (let i = 0; i < this.swordTrails.length; i += 1) {
      this.swordTrails[i]
        .setRotation(SWORD_REST_ANGLE + SLASH_TRAIL_ANGLES[i])
        .setAlpha(0)
        .setScale(1, 1)
    }

    if (attack === 'slash') {
      // The DOG'S HEAD drives the cut. The blade remains clenched sideways in the jaw.
      this.headRig.setPosition(-3, -2).setRotation(-1.35)
      this.sword.setScale(1.09, 1.34)
      for (let i = 0; i < this.swordTrails.length; i += 1) {
        const distanceFromCenter = Math.abs(i - (this.swordTrails.length - 1) / 2)
        this.swordTrails[i]
          .setAlpha(0.5 - distanceFromCenter * 0.075)
          .setScale(1.08, 1.28)
      }
      this.tweens.add({
        targets: this.headRig,
        x: 5,
        y: 2,
        rotation: 1.55,
        duration: 150,
        ease: 'Cubic.Out',
        onComplete: () => {
          this.tweens.add({ targets: this.headRig, x: 0, y: 0, rotation: 0, duration: 72, ease: 'Quad.Out' })
        },
      })
    } else if (attack === 'stab') {
      this.headRig.setX(-4)
      this.sword.setScale(1.12, 0.92)
      this.swordTrails[2].setRotation(-0.12).setAlpha(0.4).setScale(1.3, 0.72)
      this.tweens.add({ targets: this.headRig, x: 11, duration: 56, yoyo: true, ease: 'Quad.Out' })
      this.tweens.add({
        targets: this.sword,
        x: SWORD_MOUTH_X + 21,
        rotation: -0.12,
        scaleX: 1.25,
        duration: 56,
        yoyo: true,
        ease: 'Quad.Out',
        onComplete: () => this.sword.setPosition(SWORD_MOUTH_X, 0).setRotation(SWORD_REST_ANGLE),
      })
    } else if (attack === 'dash') {
      const power = event.power ?? 0
      this.headRig.setX(-8)
      this.sword.setScale(1.18 + power * 0.18, 0.86)
      this.swordTrails[2].setRotation(-0.34).setAlpha(0.58).setScale(1.55 + power * 0.48, 0.62)
      this.tweens.add({ targets: this.headRig, x: 20, duration: 70, yoyo: true, ease: 'Expo.Out' })
      this.tweens.add({
        targets: this.sword,
        x: SWORD_MOUTH_X + 28,
        rotation: -0.34,
        duration: 70,
        yoyo: true,
        ease: 'Expo.Out',
        onComplete: () => this.sword.setPosition(SWORD_MOUTH_X, 0).setRotation(SWORD_REST_ANGLE),
      })
    } else if (attack === 'whirlwind') {
      this.sword.setScale(1.1, 1.22)
      for (let i = 0; i < this.swordTrails.length; i += 1) {
        this.swordTrails[i]
          .setRotation(SWORD_REST_ANGLE + (i / this.swordTrails.length) * Math.PI * 2)
          .setAlpha(0.3)
          .setScale(1.1, 1.2)
      }
      this.tweens.add({
        targets: this.headRig,
        rotation: Math.PI * 2.15,
        duration: 300,
        ease: 'Cubic.Out',
        onComplete: () => this.headRig.setRotation(0),
      })
    }

    this.tweens.add({ targets: this.sword, scaleY: 1.04, duration: attack === 'whirlwind' ? 255 : 118, ease: 'Quad.Out' })
    for (const trail of this.swordTrails) {
      this.tweens.add({ targets: trail, alpha: 0, scaleX: 1, scaleY: 1, duration: attack === 'whirlwind' ? 295 : 175, ease: 'Quad.Out' })
    }
  }

  private spawnDashAfterimage'''

          s, n = re.subn(r"  private animateSword\(event: Extract<SimEvent, \{ type: 'sword-attack' \}>\): void \{.*?\n  \}\n\n  private spawnDashAfterimage", new_anim, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'animateSword replacement count={n}')

          path.write_text(s)

          docs = Path('docs/IDENTITY_V0.md')
          d = docs.read_text().rstrip() + '''\n\n## Player Identity V1 — white Apple Inu + side-bite sword\n\nThe visible player is now rendered as a white/off-white dog with cool-gray shadowing, four readable paws, tail, and a bitten-apple-shaped white head with green leaf/stem. The sword is no longer held straight forward: its idle/rest transform is approximately 76° off the facing axis and the hilt is layered between distinct upper/lower jaw shapes so it reads as physically bitten from the side.\n\nThe normal slash keeps the sword clamped at that side-bite angle while the entire head rig sweeps through a broad arc. Stab/dash may temporarily angle the blade toward travel for readability, then return to the side-bite rest transform. Combat timing, hit geometry, damage, enemy density and deterministic physics are unchanged in this pass.\n'''
          docs.write_text(d)
          PY
      - name: Remove one-shot workflow before commit
        run: rm .github/workflows/player-identity-v1.yml
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/scenes/GameScene.ts docs/IDENTITY_V0.md .github/workflows/player-identity-v1.yml
          git commit -m 'feat: correct Apple Inu side-bite sword identity'
          git push origin HEAD:tmp/player-identity-v1
