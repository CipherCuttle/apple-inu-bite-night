name: player-identity-v1

on:
  push:
    branches:
      - tmp/player-identity-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/player-identity-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply player identity patch
        run: python scripts/apply-player-identity-v1.py
      - name: Remove one-shot tooling
        run: rm .github/workflows/player-identity-v1.yml scripts/apply-player-identity-v1.py
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: correct Apple Inu side-bite sword identity'
          git push origin HEAD:tmp/player-identity-v1
