name: rescue-debug

on:
  push:
    branches:
      - tmp/rescue-level-v0

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rescue-level-v0
      - name: Apply patches and print failing window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-rescue-level-v0.py')
          s = p.read_text()
          start = s.index('head_pattern =')
          end = s.index('marker = "  private createPropRenderers(): void {\\n"')
          p.write_text(s[:start] + s[end:])
          PY
          python scripts/patch-rescue-level-v0.py
          python scripts/patch-head-only.py
          nl -ba src/game/scenes/GameScene.ts | sed -n '670,695p'
