name: tower-wars-core

on:
  push:
    branches: [pivot/tower-wars-core-v0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile G1 grid tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/test_tw_grid.c \
            -o /tmp/tower-wars-grid-test

      - name: Verify deterministic grid/path contract
        run: /tmp/tower-wars-grid-test

      - name: Compile G2 authoritative build tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_match.c \
            -o /tmp/tower-wars-match-test

      - name: Verify authoritative human/bot build contract
        run: /tmp/tower-wars-match-test

      - name: Compile G3 send and income tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_send.c \
            -o /tmp/tower-wars-send-test

      - name: Verify authoritative send and periodic income contract
        run: /tmp/tower-wars-send-test

      - name: Compile G4 creep route/leak tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_creeps.c \
            -o /tmp/tower-wars-creep-test

      - name: Verify deterministic creep routing and leak contract
        run: /tmp/tower-wars-creep-test

      - name: Compile G5 tower combat tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_combat.c \
            -o /tmp/tower-wars-combat-test

      - name: Verify deterministic tower combat contract
        run: /tmp/tower-wars-combat-test

      - name: Compile G6 match termination tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_terminal.c \
            -o /tmp/tower-wars-terminal-test

      - name: Verify terminal winner loser freeze contract
        run: /tmp/tower-wars-terminal-test

      - name: Compile G7 replay/hash tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/tw_replay.c \
            spike/tower_wars/test_tw_replay.c \
            -o /tmp/tower-wars-replay-test

      - name: Verify deterministic replay and state hash contract
        run: /tmp/tower-wars-replay-test
