name: tower-wars-core

on:
  push:
    branches: [pivot/tower-wars-core-v0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile G1 grid tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/test_tw_grid.c \
            -o /tmp/tower-wars-grid-test

      - name: Verify deterministic grid/path contract
        run: /tmp/tower-wars-grid-test

      - name: Compile G2 authoritative build tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            spike/tower_wars/tw_grid.c \
            spike/tower_wars/tw_match.c \
            spike/tower_wars/test_tw_match.c \
            -o /tmp/tower-wars-match-test

      - name: Verify authoritative human/bot build contract
        run: /tmp/tower-wars-match-test
