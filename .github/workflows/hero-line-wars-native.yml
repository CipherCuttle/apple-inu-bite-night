name: hero-line-wars-native

on:
  push:
    branches: [phase-hlw/openrealm-native-v0, repair/h7-progress-legality-v0, phase-hlw/h8-browser-playable-slice-v0]
  workflow_dispatch:

concurrency:
  group: hero-line-wars-native-v0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  h1-h8-native-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Compile deterministic H3 H4 H5 authority tests
        run: |
          common=(
            spike/tower_wars/tw_grid.c
            spike/tower_wars/tw_match.c
            spike/tower_wars/tw_replay.c
            spike/tower_wars/tw_hero_combat.c
            spike/tower_wars/tw_hero_ability.c
          )
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            "${common[@]}" spike/tower_wars/test_hlw_hero_combat.c \
            -o /tmp/hlw-hero-combat-test
          /tmp/hlw-hero-combat-test
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            "${common[@]}" spike/tower_wars/test_hlw_hero_ability.c \
            -o /tmp/hlw-hero-ability-test
          /tmp/hlw-hero-ability-test
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            "${common[@]}" spike/tower_wars/test_hlw_hero_progression.c \
            -o /tmp/hlw-hero-progression-test
          /tmp/hlw-hero-progression-test

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v10
        with:
          version: 6.0.9
          no-cache: true

      - name: Clone pinned OpenRealm
        run: |
          git clone https://github.com/corepunch/open-realm.git open-realm
          git -C open-realm checkout cf12357883950c14abce8d636596952c3fc547bb
          test "$(git -C open-realm rev-parse HEAD)" = "cf12357883950c14abce8d636596952c3fc547bb"

      - name: Apply proven OpenRealm and Hero Line Wars overlays
        run: |
          cd open-realm
          python3 ../spike/wasm/patch_openrealm.py
          python3 ../spike/wasm/patch_wasm32_save.py
          python3 ../spike/wasm/patch_wasm_audio.py
          python3 ../spike/wasm/patch_wasm_menu_abi.py
          python3 ../spike/wasm/patch_wasm_init_trace.py
          python3 ../spike/wasm/patch_wasm_map_unit_smoke.py
          python3 ../spike/wasm/patch_wasm_smoke_map_resolve.py
          python3 ../spike/wasm/patch_wasm_visual_smoke_fix.py
          python3 ../spike/wasm/patch_wasm_selection_ring.py
          python3 ../spike/tower_wars/patch_hlw_native_creep.py
          python3 ../spike/tower_wars/patch_hlw_native_hero.py
          python3 ../spike/tower_wars/patch_hlw_hero_reset_reuse.py
          python3 ../spike/tower_wars/patch_hlw_basic_combat.py
          python3 ../spike/tower_wars/patch_hlw_h7_native_state.py
          python3 ../spike/tower_wars/patch_hlw_h7_progress_native.py
          git diff --check

      - name: Inject deterministic session, H7 journal and preserve menu isolation
        run: |
          python3 spike/tower_wars/patch_hlw_h7_progress_browser.py
          python3 spike/tower_wars/patch_hlw_h7_command_journal.py
          python3 spike/tower_wars/patch_hlw_h8_bot_scheduler.py
          git diff --check
          python3 spike/wasm/patch_menu_object_isolation.py
          python3 spike/tower_wars/patch_openrealm_tower_wars_build.py
          bash -n spike/wasm/build_openrealm_wasm.sh

      - name: Compile OpenRealm plus Hero Line Wars authority
        env:
          TW_BROWSER_V0: "1"
          HLW_NATIVE_V0: "1"
          HLW_HERO_V0: "1"
        run: bash spike/wasm/build_openrealm_wasm.sh open-realm

      - name: Prove H1 through H7 regressions and H8 playable local 1v1
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory open-realm/build-wasm >/tmp/hlw-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/openrealm.html >/dev/null; then break; fi
            sleep 0.25
          done

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'No Chromium-family browser found on runner' >&2
            exit 1
          fi
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h1_native_entity_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h2_hero_command_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h2_reset_reuse_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h3_basic_combat_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h4_hero_ability_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h5_hero_progression_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h6_bot_parity_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h7_progress_legality_smoke.mjs
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h7_replay_native_smoke.mjs

          set +e
          CHROME="$chrome" OPENREALM_URL=http://127.0.0.1:8765/openrealm.html \
            timeout 120s node spike/tower_wars/h8_browser_playable_smoke.mjs 2>&1 | tee h8-browser.log
          h8_status=${PIPESTATUS[0]}
          set -e
          exit "$h8_status"

      - name: Upload H8 browser failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hero-line-wars-h8-browser-trace
          path: |
            h8-browser.log
            /tmp/hlw-http.log
          if-no-files-found: warn

      - name: Upload H8 Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-line-wars-native-h8-v0
          path: |
            open-realm/build-wasm/openrealm.html
            open-realm/build-wasm/openrealm.js
            open-realm/build-wasm/openrealm.wasm
            open-realm/build-wasm/openrealm.data
          if-no-files-found: error
