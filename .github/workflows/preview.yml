name: preview-static

on:
  push:
    branches: [phase-1/combat-toy-v0]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:determinism
      - name: Publish tested dist branch
        run: |
          cp -R dist /tmp/bite-night-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan preview-dist
          git rm -rf .
          cp -R /tmp/bite-night-dist/. .
          touch .nojekyll
          printf '%s\n' "${GITHUB_SHA}" > BUILD_SHA
          git add -A
          git commit -m "preview: ${GITHUB_SHA}"
          git push --force origin HEAD:preview-dist
