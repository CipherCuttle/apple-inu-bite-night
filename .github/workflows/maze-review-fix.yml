name: maze-review-fix

on:
  push:
    branches:
      - tmp/style-maze-v0

permissions:
  contents: write

jobs:
  review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/style-maze-v0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fix
        run: node scripts/apply-maze-collision-review-fix.mjs
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Remove one-shot tooling
        if: success()
        run: |
          rm -f scripts/apply-maze-collision-review-fix.mjs .github/workflows/maze-review-fix.yml
      - name: Commit verified review fix
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+CipherCuttle@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep maze collision separation wall-safe'
          git push origin HEAD:tmp/style-maze-v0
