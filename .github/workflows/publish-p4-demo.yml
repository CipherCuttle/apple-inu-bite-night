name: publish exact P4 playable demo

on:
  push:
    branches: [demo-p4-publisher]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact validated P4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10173639951/zip" \
            -o /tmp/p4.zip
          echo "ee0ebc4ffe42f018d982a70de9794328a3112317dc1744a8b21c93c10287e813  /tmp/p4.zip" | sha256sum -c -
          rm -rf /tmp/p4
          mkdir -p /tmp/p4
          unzip -q /tmp/p4.zip -d /tmp/p4
          test -f /tmp/p4/openrealm.html
          test -f /tmp/p4/openrealm.js
          test -f /tmp/p4/openrealm.wasm
          test -f /tmp/p4/openrealm.data
          test "$(find /tmp/p4 -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Publish artifact bytes to isolated static branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-p4-static
          git rm -rf .
          cp /tmp/p4/openrealm.html ./openrealm.html
          cp /tmp/p4/openrealm.js ./openrealm.js
          cp /tmp/p4/openrealm.wasm ./openrealm.wasm
          cp /tmp/p4/openrealm.data ./openrealm.data
          git add openrealm.html openrealm.js openrealm.wasm openrealm.data
          git commit -m "demo: publish exact validated P4 artifact c62ce929"
          git push --force origin HEAD:refs/heads/demo-p4-static
