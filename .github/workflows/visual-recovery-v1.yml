name: visual-recovery-v1

on:
  push:
    branches:
      - tmp/visual-recovery-v1

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/visual-recovery-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded visual recovery
        run: python scripts/visual-rollback-v1.py
      - name: Remove one-shot tooling
        run: rm scripts/visual-rollback-v1.py .github/workflows/visual-recovery-v1.yml
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Commit verified recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover readable arena and Apple Inu scale'
          git push origin HEAD:tmp/visual-recovery-v1
