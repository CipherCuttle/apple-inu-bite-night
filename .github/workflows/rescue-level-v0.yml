name: rescue-level-v0

on:
  push:
    branches:
      - tmp/rescue-level-v0

permissions:
  contents: write

jobs:
  patch-import-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/rescue-level-v0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Import pinned Kenney Pico-8 City sample
        shell: bash
        run: |
          set -euo pipefail
          REV=e0cbe0d995554a490d4c182fe9beb8769ffbb606
          BASE="https://raw.githubusercontent.com/Tiddybub/2d-assets/$REV/modern-urban/pico-8-city"
          mkdir -p public/assets/levels/city-block licenses/third_party/kenney-pico8-city
          curl -fsSL "$BASE/Tiled/sample-map.tmx" -o /tmp/sample-map.tmx
          curl -fsSL "$BASE/Tilemap/tilemap.png" -o /tmp/tilemap.png
          curl -fsSL "$BASE/License.txt" -o licenses/third_party/kenney-pico8-city/License.txt
          curl -fsSL "$BASE/SOURCE.md" -o licenses/third_party/kenney-pico8-city/SOURCE.md
          python -m pip install --quiet pillow
          python - <<'PY'
          import csv, io, json, xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image

          img = Image.open('/tmp/tilemap.png').convert('RGBA')
          out = []
          for r, g, b, a in img.getdata():
              out.append((r, g, b, 0 if (r, g, b) == (255, 174, 182) else a))
          img.putdata(out)
          img.save('public/assets/levels/city-block/tiles.png')

          root = ET.parse('/tmp/sample-map.tmx').getroot()
          layers = []
          for layer in root.findall('layer'):
              raw = layer.find('data').text or ''
              data = [int(v) for row in csv.reader(io.StringIO(raw)) for v in row if v.strip()]
              layers.append({'id': int(layer.attrib['id']), 'name': layer.attrib['name'], 'type': 'tilelayer', 'width': int(layer.attrib['width']), 'height': int(layer.attrib['height']), 'x': 0, 'y': 0, 'opacity': 1, 'visible': True, 'data': data})
          payload = {'compressionlevel': -1, 'height': int(root.attrib['height']), 'width': int(root.attrib['width']), 'infinite': False, 'layers': layers, 'nextlayerid': 3, 'nextobjectid': 1, 'orientation': 'orthogonal', 'renderorder': 'right-down', 'tiledversion': '1.8.2', 'tileheight': 8, 'tilewidth': 8, 'type': 'map', 'version': '1.8', 'tilesets': [{'columns': 24, 'firstgid': 1, 'image': 'tiles.png', 'imageheight': 134, 'imagewidth': 215, 'margin': 0, 'name': 'city-tileset', 'spacing': 1, 'tilecount': 360, 'tileheight': 8, 'tilewidth': 8}]}
          Path('public/assets/levels/city-block/map.json').write_text(json.dumps(payload, separators=(',', ':')))
          PY
          sha256sum public/assets/levels/city-block/tiles.png public/assets/levels/city-block/map.json > licenses/third_party/kenney-pico8-city/DERIVED_SHA256.txt
      - name: Apply rescue/control/level patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-rescue-level-v0.py')
          s = p.read_text()
          start = s.index('head_pattern =')
          end = s.index('marker = "  private createPropRenderers(): void {\\n"')
          p.write_text(s[:start] + s[end:])
          PY
          python scripts/patch-rescue-level-v0.py
          python scripts/patch-head-only.py
      - name: Remove one-shot tooling
        run: rm scripts/patch-rescue-level-v0.py scripts/patch-head-only.py .github/workflows/rescue-level-v0.yml
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.json --noEmit --pretty false
          pnpm lint
          pnpm test
          pnpm build
          pnpm test:determinism
      - name: Commit verified pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebalance last-chance rescue and import city level'
          git push origin HEAD:tmp/rescue-level-v0
