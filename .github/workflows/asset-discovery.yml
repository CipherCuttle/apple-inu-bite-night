name: asset-discovery

on:
  push:
    branches: [phase-1/combat-toy-v0]
    paths:
      - .github/workflows/asset-discovery.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vetted source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bite-assets
          cd /tmp/bite-assets
          curl -fL --retry 3 -o zombies.zip 'https://opengameart.org/sites/default/files/FreeArt_Topdown_Zombies_0.zip'
          curl -fL --retry 3 -o anatomy.zip 'https://opengameart.org/sites/default/files/topdown1_tutorial_art.zip'
          curl -fL --retry 3 -o gore.zip 'https://opengameart.org/sites/default/files/rc_art_-_gore_blood_gibs.zip'
          curl -fL --retry 3 -o blood.zip 'https://opengameart.org/sites/default/files/bloodsplat.zip'
          curl -fL --retry 3 -o dog-white.png 'https://opengameart.org/sites/default/files/spritesheet_white_0.png'
          curl -fL --retry 3 -o dog-brown.png 'https://opengameart.org/sites/default/files/spritesheet_brown.png'
          sha256sum * | sort | tee SHA256SUMS.txt
      - name: Print archive inventories
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/bite-assets
          for archive in zombies.zip anatomy.zip gore.zip blood.zip; do
            echo "===== ${archive} ====="
            unzip -l "$archive"
          done
          echo '===== dog images ====='
          file dog-white.png dog-brown.png
      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: vetted-asset-discovery
          path: /tmp/bite-assets
          if-no-files-found: error
          retention-days: 3
