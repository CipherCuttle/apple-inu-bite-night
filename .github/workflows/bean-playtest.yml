name: bean-playtest

on:
  push:
    branches:
      - resurrect/bean-combat-v0
      - 'experiment/bean-*'
      - 'spike/pixi-bean-*'
      - 'experiment/graphics-stack-*'

permissions:
  contents: write

concurrency:
  group: bean-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-capture-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:determinism

      - name: Start tested browser build
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/bean-preview.log 2>&1 &
          echo $! > /tmp/bean-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          if [[ "$GITHUB_REF" == refs/heads/spike/pixi-bean-* ]]; then
            curl -fsS http://127.0.0.1:4173/pixi-spike.html >/dev/null
          fi
          if [[ "$GITHUB_REF" == refs/heads/experiment/graphics-stack-* ]]; then
            curl -fsS http://127.0.0.1:4173/graphics-bakeoff.html >/dev/null
          fi

      - name: Capture browser comparison
        run: |
          pnpm dlx playwright@1.55.0 install --with-deps chromium
          pnpm dlx playwright@1.55.0 screenshot --wait-for-timeout=2500 http://127.0.0.1:4173/ bean-phaser-baseline.png
          if [[ "$GITHUB_REF" == refs/heads/spike/pixi-bean-* ]]; then
            pnpm dlx playwright@1.55.0 screenshot --wait-for-timeout=3500 http://127.0.0.1:4173/pixi-spike.html bean-pixi-spike.png
          fi
          if [[ "$GITHUB_REF" == refs/heads/experiment/graphics-stack-* ]]; then
            pnpm dlx playwright@1.55.0 screenshot --wait-for-timeout=4300 'http://127.0.0.1:4173/graphics-bakeoff.html?mode=A&autotest=1' graphics-stack-a.png
            pnpm dlx playwright@1.55.0 screenshot --wait-for-timeout=4300 'http://127.0.0.1:4173/graphics-bakeoff.html?mode=B&autotest=1' graphics-stack-b.png
            # Rapier's WASM-backed compat module initializes after the page loads; give C a slightly later
            # capture window so its single deterministic blast is represented fairly against B.
            pnpm dlx playwright@1.55.0 screenshot --wait-for-timeout=6500 'http://127.0.0.1:4173/graphics-bakeoff.html?mode=C&autotest=1' graphics-stack-c.png
          fi

      - name: Write playtest receipt
        run: |
          printf 'commit=%s\nref=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > PLAYTEST_RECEIPT.txt

      - name: Upload tested playtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bean-playtest-${{ github.sha }}
          path: |
            bean-phaser-baseline.png
            bean-pixi-spike.png
            graphics-stack-a.png
            graphics-stack-b.png
            graphics-stack-c.png
            PLAYTEST_RECEIPT.txt
            dist
          if-no-files-found: error
          retention-days: 14

      - name: Stop local preview server
        if: always()
        run: |
          if [ -f /tmp/bean-preview.pid ]; then
            kill "$(cat /tmp/bean-preview.pid)" || true
          fi

      - name: Publish stable Bean preview branch
        if: github.ref == 'refs/heads/resurrect/bean-combat-v0'
        run: |
          cp -R dist /tmp/bean-tested-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan preview-bean
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/bean-tested-dist/. .
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > BUILD_SHA
          git add -A
          git commit -m "preview(bean): ${GITHUB_SHA}"
          git push --force origin HEAD:preview-bean

      - name: Publish stable Pixi bake-off preview branch
        if: startsWith(github.ref, 'refs/heads/spike/pixi-bean-')
        run: |
          cp -R dist /tmp/bean-pixi-tested-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan preview-pixi-bean
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/bean-pixi-tested-dist/. .
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > BUILD_SHA
          git add -A
          git commit -m "preview(pixi-bean): ${GITHUB_SHA}"
          git push --force origin HEAD:preview-pixi-bean

      - name: Publish stable graphics-stack preview branch
        if: startsWith(github.ref, 'refs/heads/experiment/graphics-stack-')
        run: |
          cp -R dist /tmp/graphics-stack-tested-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan preview-graphics-stack
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/graphics-stack-tested-dist/. .
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > BUILD_SHA
          git add -A
          git commit -m "preview(graphics-stack): ${GITHUB_SHA}"
          git push --force origin HEAD:preview-graphics-stack
