<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hero Line Wars — OpenRealm Core</title>
  <style>
    :root{color-scheme:dark;--bg:#07090d;--panel:#10151b;--line:#27313d;--text:#edf3f8;--muted:#84909c;--human:#62d9c5;--enemy:#ffad5c;--path:#1b3540;--cell:#121a22;--good:#78e08f}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    #canvas{position:fixed;inset:0;width:100vw;height:100vh;opacity:.16;filter:saturate(.55) contrast(1.1);pointer-events:none}
    #tw-root{position:fixed;z-index:5;inset:0;padding:18px;display:flex;justify-content:center;overflow:auto;background:linear-gradient(180deg,#07090dd8,#07090dee)}
    .shell{width:min(1180px,100%);display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;min-height:680px}
    header,.bar,.field-card,.controls{border:1px solid var(--line);background:#0b1016e8;box-shadow:0 12px 36px #0008}
    header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
    h1{font-size:16px;letter-spacing:.12em;margin:0;font-weight:700}
    .badge{border:1px solid #3c4d5d;padding:5px 8px;color:#b8c8d6;background:#111a22}
    #tw-status{color:var(--muted);margin-top:4px}
    .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:16px}
    .statline{display:flex;gap:12px;flex-wrap:wrap}
    .statline b{color:#fff}
    .right{text-align:right;justify-content:flex-end}
    .center{text-align:center;color:var(--muted);font-size:11px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
    .field-card{padding:12px;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}
    .field-head{display:flex;align-items:center;justify-content:space-between}
    .human{color:var(--human)} .enemy{color:var(--enemy)}
    .grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:9/7;align-self:center;width:100%;max-height:100%;user-select:none}
    .cell{position:relative;border:1px solid #202a35;background:var(--cell);min-width:0;min-height:0;transition:.12s border-color,.12s background}
    .field-card[data-player="0"] .cell{cursor:crosshair}
    .field-card[data-player="0"] .cell:hover{border-color:#64808e}
    .cell.path{background:var(--path)}
    .cell.entry::before,.cell.exit::before{position:absolute;inset:3px;font-size:9px;color:#8fa2b0;content:'IN'}
    .cell.exit::before{content:'OUT';text-align:right}
    .tower{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--human);background:#163a37}
    .tower.k1{border-radius:50%;transform:translate(-50%,-50%);background:#173341}
    .tower.k2{transform:translate(-50%,-50%);border-color:#a3d6ff;background:#24303e}
    .creep{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--enemy);box-shadow:0 0 0 2px #29190b,0 0 14px #ffad5c66}
    .creep.human-send{background:var(--human);box-shadow:0 0 0 2px #0d2824,0 0 14px #62d9c566}
    .controls{padding:12px;display:grid;grid-template-columns:1.45fr 1.05fr 1fr;gap:10px 14px}
    .group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .group strong{font-size:11px;color:var(--muted);margin-right:4px}
    .hero-group{grid-column:1/-1;padding-bottom:10px;border-bottom:1px solid #202a35}
    button{appearance:none;border:1px solid #344554;background:#121b24;color:var(--text);padding:8px 10px;font:inherit;cursor:pointer}
    button:hover{background:#192631;border-color:#567083}
    button.active{border-color:var(--human);color:var(--human)}
    button.primary{border-color:#4c7f75;color:#a7f3e4;background:#10221f}
    button.warn{border-color:#845d38;color:#ffd0a3;background:#241a11}
    #bot-status{color:var(--enemy);font-size:11px}
    #message{grid-column:1/-1;min-height:18px;color:var(--muted)}
    .ok{color:var(--good)!important}.bad{color:#ff7777!important}
    @media(max-width:820px){body{overflow:auto}#tw-root{position:absolute;min-height:100%;padding:8px}.shell{min-height:1000px}.fields{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.hero-group,#message{grid-column:1}.bar{grid-template-columns:1fr}.right{text-align:left;justify-content:flex-start}.center{text-align:left}}
  </style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="tw-root">
  <div class="shell">
    <header>
      <div><h1>HERO LINE WARS // LOCAL 1V1</h1><div id="tw-status">booting OpenRealm + authoritative session…</div></div>
      <div class="badge">OPENREALM / WASM</div>
    </header>
    <div class="bar">
      <div id="stats0" class="statline"></div>
      <div id="clock" class="center">TICK 0 · LOG 0</div>
      <div id="stats1" class="statline right"></div>
    </div>
    <div class="fields">
      <section class="field-card" data-player="0"><div class="field-head"><b class="human">YOUR LINE</b><span id="path0"></span></div><div id="grid0" class="grid"></div></section>
      <section class="field-card" data-player="1"><div class="field-head"><b class="enemy">RIVAL LINE</b><span id="path1"></span></div><div id="grid1" class="grid"></div></section>
    </div>
    <div class="controls">
      <div class="group hero-group"><strong>HERO</strong><button id="hero-center">Lane center</button><button id="hero-left">←</button><button id="hero-right">→</button><button id="hero-up">↑</button><button id="hero-down">↓</button><button id="hero-attack" class="primary">Basic attack</button><button id="hero-ability" class="warn">PHASE LANCE · 15</button><span id="bot-status">BOT: READY</span></div>
      <div class="group"><strong>BUILD</strong><button data-tower="0" class="active">Needle 50</button><button data-tower="1">Pulse 75</button><button data-tower="2">Anvil 100</button><span>click your grid</span></div>
      <div class="group"><strong>SEND</strong><button data-send="0">Scout 40</button><button data-send="1">Swarm 60</button><button data-send="2">Brute 90</button><button data-send="3">Siege 130</button></div>
      <div class="group"><button id="play" class="primary">Run match</button><button id="step">Play tick</button><button id="step10">+10 play</button><button id="replay">Verify H7 replay</button><button id="reset">Reset</button></div>
      <div id="message"></div>
    </div>
  </div>
</div>
<script>
  let selectedTower = 0
  let playTimer = null
  const BOT_SEND_SEQUENCE = [0, 1, 0, 2]
  const BOT_SEND_COST = [40, 60, 90, 130]
  const botState = { sendIndex: 0, lastActTick: -1, lastMoveGoal: '', actions: [] }
  const byId = (id) => document.getElementById(id)

  function snap() {
    const ptr = Module._TW_BrowserSnapshot()
    return JSON.parse(Module.UTF8ToString(ptr))
  }

  function apiCall(name, ...args) {
    const fn = Module[name]
    if (typeof fn !== 'function') throw new Error(`missing wasm export ${name}`)
    return fn(...args)
  }

  function heroPosition(actor) {
    return [apiCall('_HLW_BrowserHeroX', actor), apiCall('_HLW_BrowserHeroY', actor)]
  }

  function setMessage(text, ok = null) {
    const el = byId('message')
    el.textContent = text
    el.className = ok === true ? 'ok' : ok === false ? 'bad' : ''
  }

  function recordBot(action) {
    botState.actions.push(action)
    if (botState.actions.length > 64) botState.actions.shift()
    byId('bot-status').textContent = `BOT: ${action.kind.toUpperCase()}${action.detail ? ` · ${action.detail}` : ''}`
    return action
  }

  function resetBot() {
    botState.sendIndex = 0
    botState.lastActTick = -1
    botState.lastMoveGoal = ''
    botState.actions.length = 0
    byId('bot-status').textContent = 'BOT: READY'
  }

  function cellWorld(creep) {
    return [
      -160 + creep.x * 40,
      82 + (creep.y - 3) * 22,
    ]
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value))
  }

  function botAct(state = snap()) {
    if (state.terminal) return recordBot({ tick: state.tick, kind: 'terminal' })
    if (botState.lastActTick === state.tick) return { tick: state.tick, kind: 'already-acted' }
    botState.lastActTick = state.tick

    const incoming = state.creeps.filter((creep) => creep.target === 1).sort((a, b) => a.id - b.id)
    if (incoming.length) {
      const target = incoming[0]
      const [tx, ty] = cellWorld(target)
      const [hx, hy] = heroPosition(1)
      const dx = tx - hx
      const dy = ty - hy
      const distance = Math.hypot(dx, dy)

      if (distance > 48) {
        const goalX = clamp(tx, -160, 160)
        const goalY = clamp(ty, 24, 160)
        const goal = `${goalX},${goalY}`
        if (botState.lastMoveGoal !== goal && apiCall('_HLW_BrowserHeroMove', 1, goalX, goalY) === 1) {
          botState.lastMoveGoal = goal
          return recordBot({ tick: state.tick, kind: 'move', detail: `creep ${target.id} @ ${goal}` })
        }
        return recordBot({ tick: state.tick, kind: 'pursue', detail: `creep ${target.id}` })
      }

      if (state.tick >= state.heroAbilityReady[1] && state.players[1].gold >= 15 &&
          apiCall('_HLW_BrowserHeroAbility', 1) === 1) {
        return recordBot({ tick: state.tick, kind: 'ability', detail: `creep ${target.id}` })
      }
      if (state.tick >= state.heroReady[1] && apiCall('_HLW_BrowserHeroAttack', 1) === 1) {
        return recordBot({ tick: state.tick, kind: 'attack', detail: `creep ${target.id}` })
      }
      return recordBot({ tick: state.tick, kind: 'hold', detail: `creep ${target.id}` })
    }

    const ownsActiveCreep = state.creeps.some((creep) => creep.sender === 1)
    const kind = BOT_SEND_SEQUENCE[botState.sendIndex % BOT_SEND_SEQUENCE.length]
    if (!ownsActiveCreep && state.players[1].gold >= BOT_SEND_COST[kind] &&
        apiCall('_TW_BrowserSend', 1, kind) === 1) {
      botState.sendIndex++
      return recordBot({ tick: state.tick, kind: 'send', detail: `kind ${kind}` })
    }

    const [hx, hy] = heroPosition(1)
    const anchor = [-120, 82]
    if (hx !== anchor[0] || hy !== anchor[1]) {
      const goal = `${anchor[0]},${anchor[1]}`
      if (botState.lastMoveGoal !== goal && apiCall('_HLW_BrowserHeroMove', 1, anchor[0], anchor[1]) === 1) {
        botState.lastMoveGoal = goal
        return recordBot({ tick: state.tick, kind: 'move', detail: 'defensive anchor' })
      }
      return recordBot({ tick: state.tick, kind: 'position', detail: 'defensive anchor' })
    }
    return recordBot({ tick: state.tick, kind: 'hold', detail: 'lane clear' })
  }

  function buildCell(player, x, y, state) {
    const cell = document.createElement('div')
    cell.className = 'cell'
    const path = new Set(state.players[player].path.map(([px, py]) => `${px},${py}`))
    if (path.has(`${x},${y}`)) cell.classList.add('path')
    if (x === 0 && y === 3) cell.classList.add('entry')
    if (x === 8 && y === 3) cell.classList.add('exit')

    const tower = state.players[player].towers.find((tower) => tower.x === x && tower.y === y)
    if (tower) {
      const mark = document.createElement('div')
      mark.className = `tower k${tower.kind}`
      mark.title = `tower ${tower.id}`
      cell.appendChild(mark)
    }

    for (const creep of state.creeps.filter((candidate) => candidate.target === player && candidate.x === x && candidate.y === y)) {
      const mark = document.createElement('div')
      mark.className = `creep ${creep.sender === 0 ? 'human-send' : ''}`
      mark.title = `creep ${creep.id} hp ${creep.hp} progress ${creep.progress}`
      cell.appendChild(mark)
    }

    if (player === 0) {
      cell.addEventListener('click', () => {
        const ok = apiCall('_TW_BrowserBuild', 0, selectedTower, x, y) === 1
        setMessage(ok ? `built tower at ${x},${y}` : `build rejected at ${x},${y}`, ok)
        render()
      })
    }
    return cell
  }

  function renderGrid(player, state) {
    const grid = byId(`grid${player}`)
    grid.replaceChildren()
    for (let y = 0; y < 7; y++) for (let x = 0; x < 9; x++) grid.appendChild(buildCell(player, x, y, state))
  }

  function render() {
    if (!globalThis.__TW_READY) return null
    const state = snap()
    const hero0 = heroPosition(0)
    const hero1 = heroPosition(1)
    byId('stats0').innerHTML = `<b class="human">P1</b><span>G <b>${state.players[0].gold}</b></span><span>INC <b>${state.players[0].income}</b></span><span>HP <b>${state.players[0].lives}</b></span><span>LV <b>${state.heroLevel[0]}</b></span><span>XP <b>${state.heroXP[0]}</b></span><span>DMG <b>${state.heroDamage[0]}</b></span><span>POS <b>${hero0[0]},${hero0[1]}</b></span>`
    byId('stats1').innerHTML = `<span>G <b>${state.players[1].gold}</b></span><span>INC <b>${state.players[1].income}</b></span><span>HP <b>${state.players[1].lives}</b></span><span>LV <b>${state.heroLevel[1]}</b></span><span>XP <b>${state.heroXP[1]}</b></span><span>POS <b>${hero1[0]},${hero1[1]}</b></span><b class="enemy">BOT</b>`
    byId('clock').textContent = `TICK ${state.tick} · LOG ${state.eventCount} · CREEPS ${state.activeCount}`
    byId('path0').textContent = `PATH ${state.players[0].pathLength}`
    byId('path1').textContent = `PATH ${state.players[1].pathLength}`
    renderGrid(0, state)
    renderGrid(1, state)
    if (state.terminal && playTimer) stopPlay()
    return state
  }

  function reset() {
    stopPlay()
    resetBot()
    const ok = apiCall('_TW_BrowserReset') === 1
    setMessage(ok ? 'fresh deterministic local 1v1' : 'reset failed', ok)
    return render()
  }

  function heroMove(x, y) {
    const ok = apiCall('_HLW_BrowserHeroMove', 0, clamp(x, -160, 160), clamp(y, -160, -24)) === 1
    setMessage(ok ? `hero moving to ${clamp(x, -160, 160)},${clamp(y, -160, -24)}` : 'hero move rejected', ok)
    render()
    return ok ? 1 : 0
  }

  function heroNudge(dx, dy) {
    const [x, y] = heroPosition(0)
    return heroMove(x + dx, y + dy)
  }

  function heroAttack() {
    const ok = apiCall('_HLW_BrowserHeroAttack', 0) === 1
    setMessage(ok ? 'basic attack accepted' : 'basic attack rejected', ok)
    render()
    return ok ? 1 : 0
  }

  function heroAbility() {
    const ok = apiCall('_HLW_BrowserHeroAbility', 0) === 1
    setMessage(ok ? 'PHASE LANCE accepted' : 'PHASE LANCE rejected', ok)
    render()
    return ok ? 1 : 0
  }

  function playTick() {
    const before = snap()
    if (before.terminal) {
      setMessage('match terminal · reset to play again', false)
      stopPlay()
      return 0
    }
    botAct(before)
    const stepped = apiCall('_TW_BrowserStep', 1)
    if (stepped !== 1) {
      setMessage('authoritative step failed', false)
      stopPlay()
      render()
      return 0
    }
    render()
    return 1
  }

  function playTicks(count) {
    for (let i = 0; i < count; i++) {
      if (playTick() !== 1) return 0
    }
    return 1
  }

  function startPlay() {
    if (playTimer) return
    byId('play').textContent = 'Pause match'
    playTimer = setInterval(() => playTick(), 110)
    setMessage('local 1v1 running · deterministic bot active')
  }

  function stopPlay() {
    if (playTimer) clearInterval(playTimer)
    playTimer = null
    const button = byId('play')
    if (button) button.textContent = 'Run match'
  }

  function nativeReplay() {
    stopPlay()
    const exportName = typeof Module._HLW_BrowserNativeReplayVerify === 'function'
      ? '_HLW_BrowserNativeReplayVerify'
      : '_TW_BrowserReplayVerify'
    const ok = apiCall(exportName) === 1
    setMessage(ok ? 'ordered authoritative + native replay verified' : 'replay divergence', ok)
    render()
    return ok ? 1 : 0
  }

  globalThis.__TW_BOOT = () => {
    const required = [
      '_TW_BrowserReset', '_TW_BrowserSnapshot', '_TW_BrowserSend', '_TW_BrowserStep',
      '_HLW_BrowserHeroMove', '_HLW_BrowserHeroAttack', '_HLW_BrowserHeroAbility',
      '_HLW_BrowserHeroX', '_HLW_BrowserHeroY',
    ]
    if (required.some((name) => typeof Module[name] !== 'function')) {
      byId('tw-status').textContent = 'Hero Line Wars exports missing'
      byId('tw-status').className = 'bad'
      return
    }
    if (Module._TW_BrowserReset() !== 1) {
      byId('tw-status').textContent = 'authoritative session init failed'
      byId('tw-status').className = 'bad'
      return
    }
    resetBot()
    globalThis.__TW_READY = true
    globalThis.__TW_API = {
      snapshot: snap,
      heroPosition,
      reset,
      build: (actor,tower,x,y) => { const result = apiCall('_TW_BrowserBuild',actor,tower,x,y); render(); return result },
      send: (actor,creep) => { const result = apiCall('_TW_BrowserSend',actor,creep); render(); return result },
      step: (ticks) => { const result = apiCall('_TW_BrowserStep',ticks); render(); return result },
      heroMove,
      heroAttack,
      heroAbility,
      botAct,
      playTick,
      playTicks,
      nativeReplay,
      render,
      botState,
    }
    globalThis.__HLW_H8 = { botState }
    byId('tw-status').textContent = 'OpenRealm WebGL2 alive · human vs deterministic bot ready'
    byId('tw-status').className = 'ok'
    render()
  }

  document.querySelectorAll('[data-tower]').forEach((button) => button.addEventListener('click', () => {
    selectedTower = Number(button.dataset.tower)
    document.querySelectorAll('[data-tower]').forEach((candidate) => candidate.classList.toggle('active', candidate === button))
  }))
  document.querySelectorAll('[data-send]').forEach((button) => button.addEventListener('click', () => {
    const ok = apiCall('_TW_BrowserSend', 0, Number(button.dataset.send)) === 1
    setMessage(ok ? 'creep sent to rival line' : 'send rejected', ok)
    render()
  }))
  byId('hero-center').addEventListener('click', () => { const [x] = heroPosition(0); heroMove(x, -82) })
  byId('hero-left').addEventListener('click', () => heroNudge(-40, 0))
  byId('hero-right').addEventListener('click', () => heroNudge(40, 0))
  byId('hero-up').addEventListener('click', () => heroNudge(0, 22))
  byId('hero-down').addEventListener('click', () => heroNudge(0, -22))
  byId('hero-attack').addEventListener('click', heroAttack)
  byId('hero-ability').addEventListener('click', heroAbility)
  byId('play').addEventListener('click', () => playTimer ? stopPlay() : startPlay())
  byId('step').addEventListener('click', playTick)
  byId('step10').addEventListener('click', () => playTicks(10))
  byId('replay').addEventListener('click', nativeReplay)
  byId('reset').addEventListener('click', reset)

  var Module = {
    canvas: byId('canvas'),
    arguments: ['-data', '/share', '+map', '__wasm_smoke__'],
    print: (...args) => console.log(...args),
    printErr: (...args) => console.error(...args),
    setStatus: () => {},
    onRuntimeInitialized: () => setTimeout(() => globalThis.__TW_BOOT(), 0),
    onAbort: (reason) => { byId('tw-status').textContent = `OPENREALM_ABORT=${reason}`; byId('tw-status').className='bad' }
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
